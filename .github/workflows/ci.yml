name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `tsc -b` dekker src, vite.config og api/ — sistnevnte ble aldri
      # typesjekket før, og skjulte en syntaksfeil i kontaktskjemaet.
      - run: npm run build
