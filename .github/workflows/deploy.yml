# Midlertidig: publiserer til GitHub Pages fram til firix.no flyttes til Vercel.
#
# Pages kan ikke kjøre /api-rutene, så mens denne er i bruk:
#  - kontaktskjemaet faller automatisk tilbake til Web3Forms
#  - /admin kan ikke logge inn (krever ADMIN_PASSWORD på en server)
#  - prosjektlisten leses fra src/content/projects.ts
#
# Når Vercel er på plass: slett denne filen og public/CNAME.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Reserveløsning for kontaktskjemaet så lenge det ikke finnes et /api.
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          # VITE_ADMIN_PASSWORD er bevisst fjernet: alt med VITE_-prefiks havner
          # i den offentlige JS-bundlen og kan leses av hvem som helst.

      # GitHub Pages har ingen SPA-omskriving. Serveres index.html også på 404,
      # beholder nettleseren adressen og React Router tar over, slik at
      # /prosjekter/privatsamleren fungerer ved direkte innlasting.
      - name: SPA-fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
